name: 功能建议
description: 提议与项目安全边界一致的新能力或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述用户场景和当前阻碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望的行为、输入和输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选；说明已经尝试或考虑过的方法。
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: 安全、隐私与版权影响
      description: 是否新增网络目标、凭证、个人数据、发布行为或受版权保护的内容？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 项目边界确认
      options:
        - label: 此建议不要求绕过登录、付费墙、验证码或网站访问控制。
          required: true
