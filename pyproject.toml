[project]
name = "ai-edu-media-tracker"
version = "0.1.0"
description = "Local-first, evidence-bound tracker for Chinese AI education media."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Education Media Tracker contributors" }]
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.27.0",
  "markdown-it-py>=3.0.0",
  "pydantic>=2.8.0",
  "selectolax>=0.3.21",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9",
  "mypy>=1.11.0",
  "pip-audit>=2.7.3",
  "pyyaml>=6.0.2",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.0",
]

[project.scripts]
ai-edu-tracker = "ai_edu_tracker.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_edu_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_edu_tracker"]

[tool.bandit]
exclude_dirs = ["tests"]
